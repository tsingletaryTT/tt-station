<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TT Station</title>
<style>
  html, body { margin: 0; height: 100%; background: #050f0e; color: #e7f0ee;
    font: 15px/1.5 "Inter Tight", system-ui, sans-serif; }
  body { display: grid; place-items: center;
    background-image: radial-gradient(#678583 1px, transparent 1px); background-size: 24px 24px; }
  main { max-width: 440px; text-align: center; padding: 32px; }
  h1 { font-weight: 500; font-size: 24px; letter-spacing: -0.3px; margin: 16px 0 8px; }
  p { color: #7d9b97; margin: 0 0 6px; }
  code { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #b3ccc8; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ffa333; margin: 0 auto;
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1>Connecting…</h1>
  <p>TT Station starts as soon as its agent answers. Trying again every few seconds.</p>
  <p><code id="why"></code></p>
  <p id="local-hint"><code>systemctl --user status tt-station-agentd</code></p>
  <p id="remote-hint" hidden><button id="other" style="margin-top: 14px; font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .8px; text-transform: uppercase; background: #12796e; color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;">Add or pick another device</button></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("why").textContent = q.get("why") || "";
  if (q.get("remote")) {
    // Another computer: the device isn't here to check with systemctl; adding it again or picking another is.
    document.getElementById("local-hint").hidden = true;
    document.getElementById("remote-hint").hidden = false;
    document.getElementById("other").onclick = () => window.ttDesktop?.showConnect?.();
  }
</script>
</body>
</html>
