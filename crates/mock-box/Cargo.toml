[package]
name = "mock-box"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published to crates.io (also lets cargo-deny accept path deps without a version).
publish = false

[dependencies]
libttstation = { path = "../libttstation" }
anyhow = { workspace = true }
clap = { workspace = true }
mdns-sd = { workspace = true }
tokio = { workspace = true }
# `serve` (Task 12) fakes the agent control API + a fake vLLM endpoint over
# HTTP -- same axum/serde stack `tt-station-agentd` uses for the real thing,
# so the JSON shapes on the wire stay recognizable between mock and real.
# `ws` (Task 4) additionally lets `GET /telemetry` upgrade to a WebSocket and
# stream a canned `tt-smi -s` frame, mirroring `tt-station-agentd`'s real
# telemetry route so the macOS app's live device strip can be exercised with
# no hardware.
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for `pair/init`'s printed code -- cosmetic, since `pair/complete`
# accepts any code for the mock (see routes.rs doc comment).
rand = { workspace = true }
# `/ssh/authorize` (Task 4) reuses the REAL agent's pure, unit-tested
# validate/authorize/revoke core (`authkeys.rs`) instead of reimplementing
# key parsing/dedupe/permission-hardening here -- this mock only supplies a
# throwaway temp-dir path, never `~/.ssh` (see `serve`'s authorized-keys path).
tt-station-agentd = { path = "../tt-station-agentd" }
# `serve --tls-port`: the same API over HTTPS, like a box's TLS port, so the
# CLI's certificate pinning can be tested end to end. Same stack as the agent
# (axum-server + rustls with ring); the certificate comes from the agent's own
# `tls::identity`.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
