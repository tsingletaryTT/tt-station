[package]
name = "tt-station-tray"
version.workspace = true
edition.workspace = true
description = "Linux tray for tt-station: one Station abstraction over this machine (official tt CLI) and paired QuietBoxes (agent API)."

[dependencies]
libttstation = { path = "../libttstation" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
ksni = "0.3"
# Plain GTK4 for the main window (libadwaita is not installed on the build box). `v4_12` is the
# newest feature the installed GTK 4.14 satisfies that we need; see src/window/mod.rs.
gtk4 = { version = "0.9", features = ["v4_12"] }

[dev-dependencies]
# Runs the built `tt-station-tray --smoke` binary in tests/smoke.rs.
assert_cmd = "2"
tempfile = { workspace = true }
# Builds and spawns the `mock-box` binary from another workspace crate (same pattern as
# tt-station's e2e test).
escargot = "0.5"
# Reads mock-box's `/status` raw to see its test-only `last_run_options` key.
reqwest = { workspace = true }
