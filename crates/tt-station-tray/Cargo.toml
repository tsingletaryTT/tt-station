[package]
name = "tt-station-tray"
version.workspace = true
edition.workspace = true
description = "Linux tray for tt-station: one Station abstraction over this machine (official tt CLI) and paired QuietBoxes (agent API)."

[dependencies]
libttstation = { path = "../libttstation" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
ksni = "0.3"
# Same major as the zbus ksni uses (5.x); used only for one NameHasOwner call in src/sni_host.rs.
# `default-features = false` + `tokio` reuses the runtime ksni already pulls (no async-io thread).
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Plain GTK4 for the main window (libadwaita is not installed on the build box). No `v4_*` feature
# is enabled: the window compiles against the base GTK 4.0 API, so the build should not need a
# newer GTK than Ubuntu 22.04's 4.6 (not yet built or run there; see docs/reference/linux-tray.md).
gtk4 = "0.9"

[dev-dependencies]
# Runs the built `tt-station-tray --smoke` binary in tests/smoke.rs.
assert_cmd = "2"
tempfile = { workspace = true }
# Builds and spawns the `mock-box` binary from another workspace crate (same pattern as
# tt-station's e2e test).
escargot = "0.5"
# Reads mock-box's `/status` raw to see its test-only `last_run_options` key.
reqwest = { workspace = true }
