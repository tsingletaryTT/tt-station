[package]
name = "libttstation"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published to crates.io (also lets cargo-deny accept path deps without a version).
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
mdns-sd = { workspace = true }
# `rustls-tls` on top of the workspace's `default-features = false` base
# (which only turns on `json`) so this crate never pulls in openssl -- the
# CLI reaches boxes over `https://` with the certificate pinned (see
# src/transport.rs); plain `http://` is only for the box itself.
reqwest = { workspace = true, features = ["rustls-tls"] }
# HTTPS to boxes with their certificate pinned (src/transport.rs): a custom
# `ServerCertVerifier` handed to reqwest via `use_preconfigured_tls`, so this must
# be the same rustls reqwest uses. Ring as the provider, like the agent; `ring`
# itself for the fingerprint's SHA-256.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"

# Only ever built on macOS: the `KeychainStore` `SecretStore` impl in
# secrets.rs is itself `#[cfg(target_os = "macos")]`-gated, so this crate
# (and its FFI bindings to the macOS `Security.framework`) never needs to
# compile on Linux/CI.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
# tests/transport.rs: a throwaway HTTPS box with a fresh self-signed certificate.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
