name: CI

# Not on the review/* branches: each adds one area to the last (docs/landing-plan.md), so
# most don't build on their own by design. CI runs on the branch they're cut from.
on:
  push:
    branches-ignore: ["review/**"]
  pull_request:

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assert version matches across Cargo.toml, changelog, and the panel
        run: |
          set -euo pipefail
          CARGO=$(grep -m1 '^version = ' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          DEB=$(head -1 debian/changelog | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          PANEL=$(grep -m1 '^__version__ = ' box-panel/tt-station-panel.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Cargo.toml:       $CARGO"
          echo "debian/changelog: $DEB"
          echo "panel __version__: $PANEL"
          fail=0
          [ "$DEB" = "$CARGO" ]   || { echo "::error::debian/changelog ($DEB) != Cargo.toml ($CARGO)"; fail=1; }
          [ "$PANEL" = "$CARGO" ] || { echo "::error::panel __version__ ($PANEL) != Cargo.toml ($CARGO)"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "Run scripts/bump-version.sh <version> to fix."; exit 1; }
          echo "All version strings agree: $CARGO"

  desktop:
    name: Desktop app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    env:
      # The Electron binary isn't needed to typecheck, test or build the UI.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust (build, test, lint)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      # About 80 test binaries with full debug info fill the runner's disk, and the
      # linker dies with a bus error. Line tables keep backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      # rustup is preinstalled on GitHub runners; with no argument it installs
      # the channel and components pinned in rust-toolchain.toml, so CI, release
      # builds and developer machines all use the same rustc/clippy/rustfmt.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show  # older rustup: `show` installs it
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      # Hardware stubs. Some agentd tests build an AppState whose defaults run
      # real host commands: the power path's default is a real `tt-smi -r`
      # chip reset (and `systemctl suspend/reboot/poweroff`), and serving /
      # apps code shells out to `docker`, `systemctl --user`, `systemd-run`
      # and Tenstorrent's `tt` CLI. On a QuietBox that would reset the chips
      # mid-test; on a runner the binaries are missing or (docker,
      # systemctl) real. No-op stubs that exit 0 keep every test hermetic.
      # They go on PATH for the test step only.
      # Transcription jobs cut recordings with ffmpeg; their tests make one with it.
      # Only ffmpeg: its recommended packages took the runner 27 minutes.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - name: Create no-op hardware stubs
        run: |
          mkdir -p "$RUNNER_TEMP/hw-stubs"
          for cmd in tt-smi docker systemctl systemd-run tt; do
            printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/hw-stubs/$cmd"
            chmod +x "$RUNNER_TEMP/hw-stubs/$cmd"
          done
      - name: Test (hardware stubbed)
        run: PATH="$RUNNER_TEMP/hw-stubs:$PATH" cargo test --workspace --locked --no-fail-fast
      # Start the agent the Build step made and probe it: a router that panics
      # at start (axum's "Overlapping method route") passes every unit test
      # and still crash-loops on a box. The script stubs the hardware itself.
      - name: Smoke test the agent (start, GET /healthz + /status, stop)
        run: scripts/smoke-agent.sh target/debug/tt-station-agentd
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all --check

  package:
    name: Package (.deb build, install, smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts debhelper
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          rustup show active-toolchain
      # build-deb.sh builds the app that goes in the package.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The same script the Release workflow builds with.
      - name: Build .deb packages
        run: ./build-deb.sh
      - name: Stage packages
        run: |
          mkdir -p dist
          cp ../tt-station_*_amd64.deb ../tt-station-panel_*_amd64.deb dist/
          ls -lh dist/
      # Installs the .deb with apt in a clean ubuntu:24.04, checks the files the
      # updater and systemd rely on, starts the installed agent with stubbed
      # hardware and a throwaway config dir, waits for GET /healthz and
      # GET /status to answer 200, stops it, and purges the package.
      - name: Install in a clean container and smoke test
        run: scripts/smoke-deb.sh ubuntu:24.04 dist

  cargo-deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Licenses (allow-list in deny.toml), bans (duplicate majors warn,
      # wildcards deny) and sources (crates.io only): blocking.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # RustSec advisories. Non-blocking for now: new advisories land daily and
      # would turn unrelated PRs red. As of 2026-10-15 it reports rustls,
      # h2 and crossbeam-epoch advisories, all fixed by
      # `cargo update -p rustls -p h2 -p crossbeam-epoch` (lockfile-only).
      # TODO(eng-hygiene): make blocking after that update lands.
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  docs:
    name: Docs reference only real routes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Every endpoint named in docs/reference/*.md must exist in the agent's
      # router (crates/tt-station-agentd/src/routes.rs), with the stated method.
      - name: Check docs/reference endpoints against the route table
        run: python3 scripts/check-doc-routes.py

  python:
    name: Python helpers (unittest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The agent's Python helpers (Code holder, sandbox launcher, bring-up permission
      # policy, lease runner, Orchard bridge): standard library only, no hardware.
      - name: Run the helpers' tests
        working-directory: crates/tt-station-agentd/src
        run: python3 -m unittest -v

  ios:
    name: iOS app (simulator build)
    # Never built in CI before, and it needs signing-free simulator settings
    # and Xcode 26 (the app targets iOS 26 / Liquid Glass): allowed to fail
    # until it has gone green once. TODO(eng-hygiene): drop continue-on-error.
    #
    # macos-14 images ship Xcode 15/16 only, which can't build an iOS 26 app,
    # so this uses macos-15, whose image carries Xcode 26.
    runs-on: macos-15
    continue-on-error: true
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project (ios/project.yml)
        run: xcodegen generate
      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project TTStationMobile.xcodeproj \
            -scheme TTStationMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
